plugins {
    id "com.android.application"
}

android {
    namespace "com.fptautomotive.safeloop"
    compileSdk 35

    defaultConfig {
        applicationId "com.fptautomotive.safeloop"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    // Android provides org.json on-device.  The JVM implementation makes the
    // exact same parser testable without Robolectric or AndroidX.
    testImplementation "org.json:json:20240303"
}
