[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tripkit"
version = "0.1.0"
description = "Trip Loader & Replayer 20 FPS cho hackathon dataset (WBS 1.2)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["tripkit", "safeloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
