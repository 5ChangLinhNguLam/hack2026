[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tripkit"
version = "0.1.0"
description = "Trip Loader & Replayer 20 FPS cho hackathon dataset (WBS 1.2)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
dms-phase2 = [
    "joblib>=1.3",
    "numpy>=1.24,<2",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4,<1.11",
    "torch>=2.2",
    "torchvision>=0.17",
    "mediapipe>=0.10.20",
]

[project.scripts]
dms-replay = "drive_state.phase_2.cli.replay:main"
dms2-eda = "drive_state.phase_2.cli.eda:main"
dms2-precompute-eyes = "drive_state.phase_2.cli.precompute_eyes:main"
dms2-precompute-faces = "drive_state.phase_2.cli.precompute_faces:main"
dms2-precompute-mouths = "drive_state.phase_2.cli.precompute_mouths:main"
dms2-precompute-embeddings = "drive_state.phase_2.cli.precompute_embeddings:main"
dms2-train-eye = "drive_state.phase_2.cli.train_eye:main"
dms2-train-mouth = "drive_state.phase_2.cli.train_mouth:main"
dms2-train-temporal = "drive_state.phase_2.cli.train_temporal:main"
dms2-train-primitives = "drive_state.phase_2.cli.train_primitives:main"
dms2-standardize-five-state = "drive_state.phase_2.cli.standardize_five_state:main"
dms2-train-mobilenet-lstm = "drive_state.phase_2.cli.train_mobilenet_lstm:main"
dms2-prepare-nitymed = "drive_state.phase_2.cli.prepare_nitymed:main"
dms2-demo = "drive_state.phase_2.cli.demo:main"
dms2-webcam = "drive_state.phase_2.cli.webcam:main"
dms2-benchmark = "drive_state.phase_2.cli.benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tripkit*", "drive_state*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
